api:
  host: 0.0.0.0
  port: 8000
  workers: 1
  reload: false
  log_level: info
  title: Arabic ID OCR API
  version: 1.0.0
  description: >
    REST API for extracting structured data from Egyptian National ID cards
    using YOLOv11 field detection + Arabic OCR.

model:
  detector_path: ./runs/train/arabic_id_detector/weights/best.pt
  mlflow_model_uri: null    # set to use MLflow registry, e.g. models:/arabic-id-ocr/Production
  device: cpu

  # OCR engine: "tesseract" | "easyocr" | "paddleocr" | "trocr"
  # tesseract = lightest (on-prem, limited resources) ← recommended
  # easyocr   = easy setup, moderate RAM
  # paddleocr = best Arabic accuracy, needs ~1GB RAM
  # trocr     = transformer-based, needs ~2GB RAM
  ocr_engine: paddleocr
  ocr_languages: ["ar", "en"]   # used by easyocr / paddleocr only
  ocr_gpu: false

inference:
  max_image_size_mb: 10
  supported_formats:
    - jpg
    - jpeg
    - png
    - webp
  batch_size: 1
  timeout_seconds: 30

monitoring:
  enable_metrics: true
  metrics_port: 9090
  log_predictions: true
  prediction_log_path: ./data/prediction_logs
  drift_check_interval: 100   # check drift every N predictions
