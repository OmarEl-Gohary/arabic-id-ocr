# SECRET
# ─────────────────────────────────────────────────────────────────────────────
# A Secret stores sensitive data (API keys, passwords) inside the cluster.
# K8s encrypts secrets at rest — safer than putting them in a ConfigMap.
#
# HOW TO USE:
#   Do NOT apply this file directly (it has placeholder values).
#   Instead, create the secret from your .env file:
#
#   kubectl create secret generic ocr-secrets \
#       --from-env-file=.env \
#       --namespace=ocr-api
#
# To check what's stored (values are base64-encoded):
#   kubectl get secret ocr-secrets -n ocr-api -o yaml
#
# To delete and recreate with new values:
#   kubectl delete secret ocr-secrets -n ocr-api
#   kubectl create secret generic ocr-secrets --from-env-file=.env -n ocr-api

apiVersion: v1
kind: Secret
metadata:
  name: ocr-secrets
  namespace: ocr-api
type: Opaque
stringData:               # stringData lets you write plain text (K8s encodes it)
  OCR_API_KEY: ""         # replace with your real key, or use --from-env-file
  ALLOWED_ORIGINS: "*"
  MLFLOW_TRACKING_URI: "sqlite:///mlruns.db"
