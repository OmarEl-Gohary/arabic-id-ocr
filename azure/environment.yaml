$schema: https://azuremlschemas.azureedge.net/latest/environment.schema.json

name: arabic-ocr-env
version: 1
description: YOLOv11 + MLflow training environment with CUDA support

# Azure ML curated image: PyTorch 2.2 + CUDA 12.1 (no need to install torch manually)
image: mcr.microsoft.com/azureml/curated/acpt-pytorch-2.2-cuda12.1:latest

conda_file:
  name: arabic-ocr
  channels:
    - defaults
    - conda-forge
  dependencies:
    - python=3.11
    - pip:
      - ultralytics>=8.3.0
      - mlflow>=2.13.0
      - opencv-python-headless>=4.8.0   # headless: no display needed on server
      - Pillow>=10.0.0
      - numpy>=1.24.0
      - pandas>=2.0.0
      - pyyaml>=6.0
      - easyocr>=1.7.1
      - tqdm>=4.66.0
