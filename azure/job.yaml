$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command

experiment_name: arabic-ocr-detection
display_name: yolo11-arabic-id-training

description: >
  Train YOLOv11n to detect 15 fields on Egyptian National ID cards.
  Dataset: Roboflow Egyptian-Person-ID-v1 (3520 images).

code: ..

command: >-
  python src/training/train.py
  --config configs/training-azure.yaml
  --dataset-dir ${{inputs.dataset}}

inputs:
  dataset:
    type: uri_folder
    path: azureml:egyptian-id-dataset:1

environment: azureml:arabic-ocr-env:2

compute: azureml:cpu-cluster

environment_variables:
  PYTHONPATH: "."

resources:
  instance_count: 1

limits:
  timeout: 7200
